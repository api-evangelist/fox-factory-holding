  - https://ridefox.com/api/ucp/mcp
plan_count: 0
plans: []
access:
  model: free-anonymous
  signup_required: false
  api_key_required: false
  note: >-
    tools/list answered HTTP 200 with no credential. Tool calls require a UCP agent profile URI, which
    is an identity declaration rather than a purchased credential.
commerce_pricing:
  priced_object: merchandise SKUs
  currency_representation: integer ISO 4217 minor units paired with a currency code
  payment_handlers: [com.google.pay, dev.shopify.card, dev.shopify.shop_pay]
  buyer_approval_required: true
  refund_policy: https://ridefox.com/policies/refund-policy
