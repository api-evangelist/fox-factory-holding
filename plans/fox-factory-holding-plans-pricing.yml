description: >-
  Fox Factory Holding publishes no API plans, no developer tiers and no metered API pricing. Access to
  its UCP/MCP commerce endpoint is free and anonymous — no account, no key, no quota purchase. What is
  priced is merchandise: the endpoint returns per-SKU product pricing in ISO 4217 minor units, and money
  changes hands only through a buyer-approved checkout. plan_count is therefore 0 as a matter of fact,
  not as a gap.
notes: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that recorded "No public API". The no-API-plan conclusion
  stands, but the reason is now evidenced: the API exists, is callable anonymously, and is simply not
  sold.
