        type: MCPTools
    description: >-
      The FOX storefront's Universal Commerce Protocol service, transported over the Model Context
      Protocol at https://ridefox.com/api/ucp/mcp. Anonymous JSON-RPC; every tool call carries a UCP
      agent profile URI. Thirteen tools: search_catalog, lookup_catalog, get_product, get_cart,
      create_cart, update_cart, cancel_cart, get_checkout, create_checkout, update_checkout,
      complete_checkout, cancel_checkout and get_order. Checkout completion requires explicit,
      contemporaneous buyer approval and is the only operation that accepts an idempotency key. The
      server runtime is Shopify's UCP implementation; the catalog, pricing, inventory and orders are Fox
      Factory's.
