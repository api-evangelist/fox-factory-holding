description: >-
  Fox Factory Holding Corp. (NASDAQ: FOXF) designs and manufactures performance ride dynamics products —
  FOX suspension for mountain bikes, trucks and powersports vehicles, plus Race Face and Easton Cycling
  components, Method Race Wheels, Tensor Tire and Marucci Sports. It runs no developer program and
  publishes no OpenAPI, but its direct-to-consumer storefronts do expose a real, callable agent surface:
  ridefox.com serves a live Model Context Protocol endpoint implementing the Universal Commerce Protocol
  (UCP 2026-08-25) at https://ridefox.com/api/ucp/mcp, answering an anonymous tools/list with 13 tools
  for catalog search, product lookup, cart lifecycle, checkout lifecycle and order retrieval. The store
  also publishes llms.txt and agents.md agent instructions, a UCP merchant profile, and OpenID
  Connect / OAuth 2.0 discovery documents for customer accounts. The same surface is served by the Race
  Face, Easton Cycling and Method Race Wheels storefronts.
