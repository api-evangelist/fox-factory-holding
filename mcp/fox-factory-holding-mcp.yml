agent_guidance:
  published_at: https://ridefox.com/llms.txt
  mirrored_at: https://ridefox.com/agents.md
  rules:
    - Checkout requires contemporaneous human approval; agents must not complete payment autonomously.
    - The MCP endpoint is rate-limited per IP; back off on 429.
    - Pass context.address_country and context.currency for accurate pricing and availability.
    - Prices are integers in ISO 4217 minor units paired with a currency code.
