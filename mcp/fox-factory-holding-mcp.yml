    reason: >-
      Divested. Fox Factory sold its Phoenix, Arizona AAG operations — Shock Therapy, Upfit UTV and
      Geiser — to S&G Holdings and Investments Company and the businesses' former general manager on
      2026-02-26 (FOXF Form 10-Q, FY2026 Q1). The storefront serves a UCP/MCP endpoint but it is no
