provider: Fox Factory Holding
providerId: fox-factory-holding
name: FOX Commerce MCP (UCP)
description: Fox Factory Holding's FOX storefront at ridefox.com serves a live, anonymous Model Context
  Protocol endpoint at https://ridefox.com/api/ucp/mcp implementing the Universal Commerce Protocol (UCP)
  shopping service. An unauthenticated JSON-RPC tools/list returns 13 tools with full JSON Schema 2020-12
  inputSchemas covering catalog search, product lookup, cart lifecycle, checkout lifecycle and order retrieval.
  The server is advertised by the store's own /llms.txt, /agents.md, /robots.txt and /.well-known/ucp
  merchant profile.
platform_authored: true
platform_note: The server implementation is Shopify's UCP runtime (serverInfo.name "universal-commerce",
  version 0.1.0), not software Fox Factory wrote; the catalog, prices, inventory, discounts and orders
  it exposes are Fox Factory's. Recorded as a provider agent surface because it is reachable on Fox Factory's
  own host and transacts Fox Factory's own commerce, with the platform authorship stated.
deployment:
  mode: remote
  endpoint: https://ridefox.com/api/ucp/mcp
  auth: none
  verified: probed
  note: Anonymous tools/list returned HTTP 200 with the full tool set on 2026-09-14. Tool CALLS additionally
    require meta["ucp-agent"].profile (a UCP agent profile URI); calling without it returns JSON-RPC error
    -32001 invalid_profile_url with HTTP 422. Buyer-account-scoped operations use the Shopify customer-account
    OAuth server named in /.well-known/oauth-protected-resource.
