source: live GET probes of /.well-known/* on every host in the record (2026-09-14)
provider: Fox Factory Holding
providerId: fox-factory-holding
description: >-
  Well-known discovery documents served by Fox Factory Holding's direct-to-consumer storefront hosts.
  ridefox.com (the FOX brand storefront, and the redirect target of foxfactory.com) serves a live
  OpenID Connect discovery document, an RFC 8414 OAuth 2.0 authorization-server metadata document, an
  RFC 9728 OAuth 2.0 protected-resource metadata document, and a Universal Commerce Protocol (UCP)
  merchant profile at /.well-known/ucp. The identity documents are issued by Shopify on behalf of the
  merchant (issuer https://shopify.com/authentication/68121624800, the FOX shop id) because the
  storefront runs on Shopify; they are nonetheless served from Fox Factory's own hosts and describe
  Fox Factory's own customer accounts. No security.txt and no A2A agent card are served on any host.
notes: >-
  A 404 on this Shopify storefront returns an HTML shell (4,264 bytes), so every 404 below was confirmed
  by body content as well as status. The corporate domain foxfactory.com 301s to ridefox.com at the root
  but answers /.well-known/* itself with a bare text/plain "Not Found".
