provider: Fox Factory Holding
providerId: fox-factory-holding
description: >-
  Standards the FOX commerce surface declares about itself. Every entry below is evidenced by a document
  Fox Factory serves from its own host or by an observed live response — none is a marketing claim.
conformance:
  - id: ucp
    name: Universal Commerce Protocol 2026-08-25
    conforms: true
    evidence: https://ridefox.com/.well-known/ucp
    detail: >-
      The merchant profile declares ucp.version 2026-08-25 plus two prior supported versions, the
      dev.ucp.shopping service over MCP transport, and the capability set dev.ucp.shopping.checkout,
      .cart, .order, .catalog.search, .catalog.lookup, .fulfillment, .discount, plus the Shopify
      extension dev.shopify.catalog.
    domain_standard: true
    market: retail / e-commerce
  - id: mcp
    name: Model Context Protocol 2024-11-05
    conforms: true
    evidence: https://ridefox.com/api/ucp/mcp
    detail: >-
      initialize returned protocolVersion 2024-11-05 with serverInfo universal-commerce 0.1.0 and
      capabilities for tools, prompts, resources and logging; tools/list returned 13 tools.
  - id: jsonrpc-2.0
    name: JSON-RPC 2.0
    conforms: true
    evidence: https://ridefox.com/api/ucp/mcp
    detail: Requests and both success and error responses carry jsonrpc "2.0", id, and result/error members.
  - id: json-schema-2020-12
    name: JSON Schema Draft 2020-12
    conforms: true
    evidence: mcp/fox-factory-holding-mcp-tools.json
    detail: Every one of the 13 tool inputSchemas declares $schema https://json-schema.org/draft/2020-12/schema.
  - id: oidc-discovery
    name: OpenID Connect Discovery 1.0
    conforms: true
    evidence: https://ridefox.com/.well-known/openid-configuration
    detail: Serves issuer, authorization/token endpoints, jwks_uri, response_types, subject_types, id_token signing algs and claims_supported.
  - id: oauth2
    name: OAuth 2.0 (authorization code + refresh token)
    conforms: true
    evidence: https://ridefox.com/.well-known/oauth-authorization-server
    detail: grant_types_supported authorization_code, refresh_token and urn:ietf:params:oauth:grant-type:jwt-bearer.
  - id: rfc8414
    name: RFC 8414 OAuth 2.0 Authorization Server Metadata
    conforms: true
    evidence: https://ridefox.com/.well-known/oauth-authorization-server
  - id: rfc9728
    name: RFC 9728 OAuth 2.0 Protected Resource Metadata
    conforms: true
    evidence: https://ridefox.com/.well-known/oauth-protected-resource
    detail: Declares resource https://ridefox.com, authorization_servers and bearer_methods_supported [header].
  - id: rfc7636
    name: RFC 7636 PKCE
    conforms: true
    evidence: https://ridefox.com/.well-known/openid-configuration
    detail: code_challenge_methods_supported [S256].
  - id: iso4217
    name: ISO 4217 currency codes (minor units)
    conforms: true
    evidence: mcp/fox-factory-holding-mcp-tools.json
    detail: Tool descriptions specify integer amounts in ISO 4217 minor units paired with a currency code.
  - id: iso3166-1-alpha-2
    name: ISO 3166-1 alpha-2 country codes
    conforms: true
    evidence: mcp/fox-factory-holding-mcp-tools.json
    detail: catalog.context.address_country is specified as ISO 3166-1 alpha-2.
  - id: bcp47
    name: IETF BCP 47 language tags
    conforms: true
    evidence: mcp/fox-factory-holding-mcp-tools.json
    detail: catalog.context.language is specified as a BCP 47 tag.
  - id: llmstxt
    name: llms.txt / agents.md agent instructions
    conforms: true
    evidence: https://ridefox.com/llms.txt
